---
deployment:
  tasks:
    # Step 1: Set deployment paths and log file
    - export FRONTEND_PATH=/home/souprogramhr/public_html/
    - export BACKEND_PATH=/home/souprogramhr/backend/
    - export LOG_FILE=/home/souprogramhr/deployment.log

    # Step 2: Start logging
    - echo "Deployment started at $(date)" > $LOG_FILE

    # Step 3: Clean old deployment files (optional)
    # - echo "Cleaning old files..." >> $LOG_FILE
    # - /bin/rm -rf $FRONTEND_PATH* >> $LOG_FILE 2>&1
    # - /bin/rm -rf $BACKEND_PATH* >> $LOG_FILE 2>&1

    # Step 4: Build the frontend
    - echo "Building frontend..." >> $LOG_FILE
    - cd ./frontend >> $LOG_FILE 2>&1
    - npm install >> $LOG_FILE 2>&1 || { echo "Frontend npm install failed." >> $LOG_FILE; exit 1; }
    - npm run build >> $LOG_FILE 2>&1 || { echo "Frontend build failed." >> $LOG_FILE; exit 1; }
    - cp -R ./dist/* $FRONTEND_PATH >> $LOG_FILE 2>&1

    # Step 5: Setup the backend
    - echo "Setting up backend..." >> $LOG_FILE
    - cd ../backend >> $LOG_FILE 2>&1
    - npm install --production >> $LOG_FILE 2>&1 || { echo "Backend npm install failed." >> $LOG_FILE; exit 1; }
    - cp -R ./* $BACKEND_PATH >> $LOG_FILE 2>&1

    # Step 6: Restart the backend
    - echo "Restarting backend..." >> $LOG_FILE
    - /usr/local/bin/ea-app $BACKEND_PATH restart >> $LOG_FILE 2>&1 || { echo "Backend restart failed." >> $LOG_FILE; exit 1; }

    # Step 7: End logging
    - echo "Deployment completed successfully at $(date)" >> $LOG_FILE
